<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お絵描きブレード</title>
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&display=swap">
<style>
/* layout: 1画面アプリ。画用紙に描く → 段ボールの土俵で回す。工作の時間の見た目に固定(単一テーマ) */
:root{
  --kraft:#b98b56; --kraft-d:#8a6238; --paper:#efe6cf; --ink:#1d1a16;
  --red:#e2412b; --yellow:#f6c21a; --blue:#2a56c6;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --hand:"Yusei Magic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--kraft);color:var(--ink);font-family:var(--hand);font-size:16px;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 9px)}
button{font-family:var(--hand);font-size:1rem;color:var(--ink);background:var(--paper);border:3px solid var(--ink);
  border-radius:4px 9px 5px 11px;padding:.45em .9em;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.go{font-family:var(--display);background:var(--red);color:var(--paper);font-size:1.25rem}
button.on{background:var(--yellow)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-inline:16px;padding-block:12px;overflow-y:auto}
h1{font-family:var(--display);font-size:clamp(1.5rem,6vw,2.6rem);margin:0;line-height:1.1;text-align:center;
  color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
.catch{margin:0;font-size:1.05rem;background:var(--yellow);border:2px solid var(--ink);padding:.1em .7em;transform:rotate(1deg)}
#padwrap{position:relative;width:min(100%,58vh,480px);aspect-ratio:1;max-width:100%;flex:none;
  background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--kraft-d);
  background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1px);background-size:16px 16px}
#pad{width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;color:rgba(29,26,22,.4);font-size:1.1rem;padding:1em}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:520px}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.sw.on{outline:4px solid var(--paper);outline-offset:1px;background:var(--c)}
.note{margin:0;font-size:.85rem;max-width:520px;text-align:center}
/* overlays */
.over{position:absolute;inset:0;background:rgba(29,26,22,.72);display:flex;padding-inline:16px;padding-block:16px;overflow-y:auto;z-index:20}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px;width:min(100%,420px);
  display:flex;flex-direction:column;gap:10px;transform:rotate(-.6deg);margin:auto}
#rImg{width:100%;height:auto;aspect-ratio:1}
input,textarea{font-family:var(--hand);font-size:.9rem;color:var(--ink);background:#fff;border:3px solid var(--ink);padding:.4em;min-width:0;flex:1 1 150px;max-width:100%}
textarea{resize:none;word-break:break-all;flex:none}
.card h2{font-family:var(--display);margin:0;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.card img{width:120px;height:120px;border:3px solid var(--ink);background:#fff;flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>div{min-width:0;flex:1 1 150px}
.abil{background:var(--yellow);border:2px dashed var(--ink);padding:.4em .6em;margin:0}
.bar{display:grid;grid-template-columns:4.2em 1fr 2.2em;gap:8px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.bar i{display:block;height:12px;border:2px solid var(--ink);background:#fff}
.bar i b{display:block;height:100%;background:var(--red)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* battle */
#battle{padding:0;overflow:hidden}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none;width:min(46vw,210px)}
.hp{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;background:var(--paper);border:2px solid var(--ink);padding:3px;font-size:.75rem}
.hp img{width:30px;height:30px;background:#fff;border:1px solid var(--ink)}
.hp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp i{display:block;height:7px;border:1px solid var(--ink);background:#fff}
.hp i b{display:block;height:100%;background:var(--blue)}
.hp.me i b{background:var(--red)}
.hp.dead{opacity:.45;text-decoration:line-through}
#cams{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#cams button{font-size:.8rem;padding:.3em .6em}
#talk{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92%,560px);
  background:var(--ink);color:var(--paper);padding:.5em .8em;text-align:center;font-size:.95rem;pointer-events:none;border:2px solid var(--paper)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22vmin;color:var(--yellow);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none}
.pop{position:absolute;font-family:var(--display);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  pointer-events:none;white-space:nowrap;animation:pop .95s ease-out forwards;z-index:5}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r))}18%{transform:translate(-50%,-70%) scale(1.25) rotate(var(--r))}
  100%{transform:translate(-50%,-190%) scale(1) rotate(var(--r));opacity:0}}
ol.rank{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
</style>

<div id="draw" class="screen">
  <h1>お絵描きブレード</h1>
  <p class="catch">最強の絵を描け。</p>
  <div id="padwrap"><canvas id="pad" width="384" height="384"></canvas>
    <div id="hint">ここに何か描く。<br>上手さは関係ない。形が性能になる。</div></div>
  <div class="tools" id="colors"></div>
  <div class="tools">
    <button id="w0">細</button><button id="w1" class="on">中</button><button id="w2">太</button>
    <button id="undo">1本もどす</button><button id="clear">全部消す</button><button id="rnd">おまかせ落書き</button>
  </div>
  <button class="go" id="make">この絵をコマにする</button>
  <div class="tools"><input id="code" placeholder="友達の対戦コードを貼る" aria-label="対戦コード"><button id="useCode">この絵と戦う</button></div>
  <p class="note" id="codeMsg" hidden></p>
  <p class="note">丸は安定、トゲは攻撃、棒は高速、穴はすり抜け、大きい輪は引き込み。変な形ほど何か起きる。最強の型が4つ隠れている。うち3つはオーラが出る。茶色で描くだけでは足りない。</p>
</div>

<div id="battle" class="screen" hidden>
  <div id="gl"></div>
  <div id="hud"></div>
  <div id="cams"><button data-c="auto" class="on">自動</button><button data-c="top">上空</button><button data-c="side">斜め</button><button data-c="near">接近</button><button id="snd">音 ON</button></div>
  <div id="count"></div>
  <div id="talk">土俵をタップすると、あなたの絵がそこへ突進します。</div>
</div>

<div id="cardO" class="over" hidden><div class="card">
  <div class="row"><img id="cImg" alt="あなたの絵"><div><div id="cType" style="font-size:.85rem"></div><h2 id="cName"></h2></div></div>
  <p id="cKan" style="margin:0"></p>
  <p class="abil" id="cAbil"></p>
  <div id="cBars"></div>
  <div class="btns"><button id="back">描き直す</button><button class="go" id="fight">土俵に投入</button></div>
</div></div>

<div id="resO" class="over" hidden><div class="card">
  <h2 id="rTitle"></h2><p id="rText" style="margin:0"></p>
  <p class="abil" id="rWhy"></p>
  <img id="rImg" alt="結果カード">
  <p class="note">この画像をスクショして投稿。下のコードを貼ると、相手はあなたの絵と戦えます。</p>
  <textarea id="rCode" readonly rows="3" aria-label="あなたの対戦コード"></textarea>
  <div class="btns"><button id="copy">対戦コードをコピー</button></div>
  <ol class="rank" id="rRank"></ol>
  <div class="btns"><button id="again">同じ絵で再戦</button><button class="go" id="redraw">新しい絵を描く</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), G=48, CS=384, PX=CS/G, NB=48, R=10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];

/* ---------- お絵描き ---------- */
const pad=$('pad'), pc=pad.getContext('2d');
const COLORS=['#1d1a16','#e2412b','#2a56c6','#2f9a4a','#f0b400','#7a4a1e','#8a3fc0'];
let color=COLORS[0], width=16, strokes=[], cur=null;
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.setProperty('--c',c);b.style.background=c;
  b.setAttribute('aria-label','色'+(i+1));b.onclick=()=>{color=c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('colors').appendChild(b)});
[10,16,28].forEach((w,i)=>$('w'+i).onclick=()=>{width=w;[0,1,2].forEach(j=>$('w'+j).classList.toggle('on',j==i))});
function drawStroke(ctx,s){ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap=ctx.lineJoin='round';
  if(s.p.length==1){ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.w/2,0,7);ctx.fill();return}
  ctx.beginPath();ctx.moveTo(s.p[0][0],s.p[0][1]);for(let i=1;i<s.p.length;i++)ctx.lineTo(s.p[i][0],s.p[i][1]);ctx.stroke()}
function redraw(){pc.clearRect(0,0,CS,CS);strokes.forEach(s=>drawStroke(pc,s));$('hint').hidden=strokes.length>0}
const pos=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)/r.width*CS,(e.clientY-r.top)/r.height*CS]};
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);cur={c:color,w:width,p:[pos(e)]};strokes.push(cur);redraw()});
pad.addEventListener('pointermove',e=>{if(!cur)return;cur.p.push(pos(e));redraw()});
['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>cur=null));
$('undo').onclick=()=>{strokes.pop();redraw()};
$('clear').onclick=()=>{strokes=[];redraw()};

/* ---------- CPUの落書き ---------- */
const ell=(cx,cy,rx,ry,n=28)=>{const p=[];for(let i=0;i<=n;i++){const a=i/n*6.283;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p};
const P=(...a)=>{const p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);return p},S=(c,w,p)=>({c,w,p}),K=COLORS,B=K[0];
const rc=()=>pick([K[0],K[1],K[2],K[3],K[4],K[6]]),D=(x,y,w=18,c=B)=>S(c,w,[[x,y]]);
const rect=(a,b,c,d)=>P(a,b,c,b,c,d,a,d,a,b);
const arc=(cx,cy,rx,ry,a0,a1,n=16)=>{const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p};
const poly=(cx,cy,r,n,rot=-1.5708)=>arc(cx,cy,r,r,rot,rot+6.2832,n);
const star=(cx,cy,Ro,ri,n)=>{const p=[];for(let i=0;i<=n*2;i++){const a=i/(n*2)*6.2832-1.5708,r=i%2?ri:Ro;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p};
const wave=(x0,x1,y,amp,k,n=30)=>{const p=[];for(let i=0;i<=n;i++)p.push([x0+(x1-x0)*i/n,y+Math.sin(i/n*6.2832*k)*amp]);return p};
const DOODLES={
 'つるぎ':()=>[S(K[2],14,P(192,26,166,90,166,268,218,268,218,90,192,26)),S(K[4],20,P(112,282,272,282)),S(B,18,P(192,296,192,356))],

 'うんち':()=>[S(K[5],20,ell(192,300,130,44)),S(K[5],20,ell(192,222,96,40)),S(K[5],20,ell(192,150,60,34)),S(K[5],20,P(192,120,206,82,188,56))],

 'いえ':()=>[S(B,16,rect(70,170,314,350)),S(K[1],18,P(40,176,192,40,344,176)),S(K[3],14,P(170,350,170,270,220,270,220,350))],
 'なぞの棒':()=>[S(K[3],14,P(26,214,358,176))],
 'ギザギザ獣':()=>[S(K[6],14,star(192,192,162,92,11)),D(160,170),D(226,178)],

 'くるま':()=>[S(rc(),14,P(40,250,40,190,110,190,140,130,250,130,285,190,344,190,344,250,40,250)),S(B,14,ell(110,262,32,32)),S(B,14,ell(275,262,32,32))],

 'ロボ':()=>[S(B,14,rect(132,50,252,150)),S(B,14,rect(100,160,284,300)),S(B,16,P(150,300,150,362)),S(B,16,P(234,300,234,362)),S(K[1],14,P(100,200,40,250)),S(K[1],14,P(284,200,344,250)),D(165,95),D(220,95)],
 'えんぴつ':()=>[S(K[4],14,P(60,300,250,110,290,150,100,340,60,300)),S(B,14,P(250,110,330,56,290,150))],
 'ドラゴン':()=>[S(K[3],20,wave(40,300,200,50,2)),S(K[3],14,P(300,200,360,150,350,230,300,200)),S(K[1],12,P(40,200,14,150))],

 'きのこ':()=>[S(K[1],16,[...arc(192,190,160,140,3.1416,6.2832,20),[32,190]]),S(B,14,P(150,190,150,350,234,350,234,190))],

 'りんご':()=>[S(K[1],16,ell(192,215,125,120)),S(K[5],12,P(192,100,205,50)),S(K[3],12,ell(240,60,30,14))],
 'にんじん':()=>[S(K[4],16,P(120,110,264,110,192,366,120,110)),S(K[3],14,P(160,105,130,30)),S(K[3],14,P(192,105,192,20)),S(K[3],14,P(224,105,254,30))],

 'かに':()=>[S(K[1],16,ell(192,220,110,70)),S(K[1],14,P(110,170,60,100)),S(K[1],14,ell(50,75,30,30)),S(K[1],14,P(274,170,324,100)),S(K[1],14,ell(334,75,30,30)),S(K[1],12,P(100,260,40,310)),S(K[1],12,P(284,260,344,310)),S(K[1],12,P(140,285,110,350)),S(K[1],12,P(244,285,274,350))],
 'とり':()=>[S(K[2],14,ell(180,200,110,80)),S(K[4],14,P(285,180,350,200,285,220)),S(K[2],12,P(130,200,190,150,220,210)),S(B,12,P(160,278,160,340)),S(B,12,P(200,278,200,340)),D(240,180,12)],
 'ちょうちょ':()=>[S(rc(),14,ell(110,130,75,85)),S(rc(),14,ell(274,130,75,85)),S(rc(),14,ell(125,280,55,60)),S(rc(),14,ell(259,280,55,60)),S(B,16,P(192,70,192,340))],
 'て':()=>[S(B,14,ell(192,270,85,80)),...[[-70,-10],[-36,-90],[0,-110],[36,-90],[80,-20]].map(([dx,dy])=>S(B,24,P(192+dx*.8,230,192+dx*1.6,200+dy*1.5)))],

/* ---------- 形状解析: 絵 → 性能 ---------- */
function comps(N,pred,c8){const seen=new Uint8Array(N),out=[];for(let s=0;s<N;s++){if(seen[s]||!pred(s))continue;let n=0,st=[s];seen[s]=1;
  while(st.length){const i=st.pop();n++;const x=i%G,y=i/G|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy||(!c8&&dx&&dy))continue;
    const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=G||ny>=G)continue;const j=ny*G+nx;if(!seen[j]&&pred(j)){seen[j]=1;st.push(j)}}}out.push(n)}return out}
function analyze(cv,name){
  const d=cv.getContext('2d').getImageData(0,0,CS,CS).data,N=G*G,ink=new Uint8Array(N),col=new Array(N);
  for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){let c=0,r=0,g=0,b=0;
    for(let y=0;y<PX;y++)for(let x=0;x<PX;x++){const k=((gy*PX+y)*CS+gx*PX+x)*4;if(d[k+3]>80){c++;r+=d[k];g+=d[k+1];b+=d[k+2]}}
    if(c>=5){ink[gy*G+gx]=1;col[gy*G+gx]=[r/c,g/c,b/c]}}
  const out=new Uint8Array(N),st=[];
  for(let i=0;i<G;i++)[i,(G-1)*G+i,i*G,i*G+G-1].forEach(j=>{if(!ink[j]&&!out[j]){out[j]=1;st.push(j)}});
  while(st.length){const i=st.pop(),x=i%G,y=i/G|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=G||ny>=G)return;const j=ny*G+nx;if(!ink[j]&&!out[j]){out[j]=1;st.push(j)}})}
  const fill=i=>ink[i]||!out[i];
  const PAL=COLORS.map(h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16))),cc=new Array(COLORS.length).fill(0);
  let A=0,inkN=0,sx=0,sy=0,x0=G,x1=0,y0=G,y1=0,P=0,brown=0;
  for(let i=0;i<N;i++)if(fill(i)){const x=i%G,y=i/G|0;A++;sx+=x+.5;sy+=y+.5;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
    if(ink[i]){inkN++;const[r,g,b]=col[i];let bi=0,bd=1e9;PAL.forEach((q,k)=>{const dd=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(dd<bd){bd=dd;bi=k}});cc[bi]++;if(r>80&&r<190&&g/r>.4&&g/r<.78&&b/r<.5)brown++}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=G||ny>=G||!fill(ny*G+nx))P++})}
  if(inkN<10)return null;
  const cx=sx/A,cy=sy/A,prof=new Float32Array(NB).fill(.6);let sxx=0,syy=0,sxy=0,symN=0,maxR=0;
  for(let i=0;i<N;i++)if(fill(i)){const x=i%G+.5-cx,y=(i/G|0)+.5-cy,r=Math.hypot(x,y)+.6;sxx+=x*x;syy+=y*y;sxy+=x*y;maxR=Math.max(maxR,r);
    const b=((Math.atan2(y,x)/6.2832*NB)%NB+NB)%NB|0;if(r>prof[b])prof[b]=r;
    const mx=Math.floor(2*cx-(i%G+.5));if(mx>=0&&mx<G&&fill((i/G|0)*G+mx))symN++}
  const sm=new Float32Array(NB);for(let i=0;i<NB;i++)sm[i]=(prof[(i+NB-1)%NB]+prof[i]*2+prof[(i+1)%NB])/4;
  let mean=0;sm.forEach(v=>mean+=v);mean/=NB;let sd=0;sm.forEach(v=>sd+=(v-mean)**2);sd=Math.sqrt(sd/NB);
  let peaks=0;for(let i=0;i<NB;i++){const v=sm[i];if(v<mean*1.08)continue;let ok=true,mn=v;for(let k=-4;k<=4;k++){const w=sm[(i+k+NB)%NB];if(k&&Math.abs(k)<=2&&w>v)ok=false;if(k&&w==v&&k<0)ok=false;mn=Math.min(mn,w)}if(ok&&v-mn>mean*.16)peaks++}
  const tr=sxx+syy,det=sxx*syy-sxy*sxy,dq=Math.sqrt(Math.max(0,tr*tr/4-det)),elong=Math.sqrt((tr/2+dq)/Math.max(.01,tr/2-dq));
  const holes=comps(N,i=>!ink[i]&&!out[i],false).filter(n=>n>=2).length, parts=comps(N,fill,true).filter(n=>n>=3).length;
  const bw=x1-x0+1,bh=y1-y0+1,areaN=A/N,spike=sd/mean,sym=symN/A,roundN=clamp(A/(Math.PI*maxR*maxR),0,1),cplx=P/(4*Math.sqrt(A));
  const inkParts=comps(N,i=>ink[i],true).filter(n=>n>=2).length,nCol=cc.filter(n=>n>=4).length;
  const cg=Math.hypot(cx-(x0+x1+1)/2,cy-(y0+y1+1)/2)/maxR,tall=bh>bw*1.35,wide=bw>bh*1.35;
  const rw=[];for(let y=y0;y<=y1;y++){let c=0;for(let x=x0;x<=x1;x++)if(fill(y*G+x))c++;rw.push(c)}
  const th=Math.max(1,rw.length/3|0),avg=a=>a.reduce((p,c)=>p+c,0)/a.length;let necks=0;
  for(let i=2;i<rw.length-2;i++)if(rw[i]<=rw[i-2]-2&&rw[i]<=rw[i+2]-2&&!(i>2&&rw[i-1]<=rw[i-3]-2&&rw[i-1]<=rw[i+1]-2))necks++;
  // うんち型: 茶色 + 下ぶくれ(上がすぼまる) + 段がある
  const poop=brown/inkN>.6&&bh>=12&&avg(rw.slice(-th))>=avg(rw.slice(0,th))*1.6&&(necks>=1||holes>=2);
  const weird=clamp((cplx-1.1)*28+holes*7+(parts-1)*10+(1-sym)*35,0,100);
  let atk=28+spike*95+peaks*3+(tall?12:0), wt=18+areaN*170+(wide?10:0), spin=38+(elong-1)*16+roundN*22-areaN*30,
      stab=22+roundN*48+sym*28-cg*60-(tall?15:0)+(wide?8:0), spd=32+(elong-1)*14+(1-areaN*2)*24;
  let type,abil,desc;
  const set=(t,a,ds)=>{type=t;abil=a;desc=ds};
  if(poop){set('うんち型','poop','なぜか異常に強い。理由は不明。ぶつかるたびに回転が回復する。')}
  else if(inkParts==2&&holes>=1&&roundN>.68&&ink[(cy|0)*G+(cx|0)]){set('巨大な目型','eye','見つめるだけで相手が固まる。目を合わせてはいけない。');stab+=15}
  else if(nCol>=5){set('全色のせ型','rainbow','色を使いすぎて何かに目覚めた。衝撃波を連発する。');atk+=10}
  else if(A<=45&&parts==1){set('ただの点型','dot','小さすぎてほとんど当たらない。点なのに最強。');wt+=40;spd+=30;spin+=20}
  else if(elong>=2.6){set('細長い高速型','speed','超高速回転。とにかく速い。');spin+=30;spd+=30}
  else if(holes>=3){set('穴だらけ型','ghost','攻撃がときどき穴をすり抜ける。')}
  else if(holes==1&&areaN>.2&&roundN>.6&&A-inkN>inkN*1.3){set('巨大な輪っか型','pull','相手を自分のほうへ引きずり込む。');wt+=15}
  else if(peaks>=4&&peaks<=7&&sym>.6&&spike>.14){set('星型','burst','一定時間ごとに謎の衝撃波を出す。');atk+=10}
  else if(peaks>=8||spike>.3){set('ギザギザ攻撃型','bounce','トゲに触れた相手を大きく弾き飛ばす。');atk+=22}
  else if(cplx>2.3||parts>=3){set('意味不明型','random','何が起きるかは回してみるまでわからない。')}
  else if(peaks==3&&roundN<.62){set('三角アタック型','tip','尖った角で突く。おにぎりも三角。');atk+=18}
  else if(areaN>.3&&roundN<.78){set('重量級','heavy','ほとんど動かない。ぶつかると相手が飛ぶ。');wt+=30;spd-=18}
  else if(roundN>.78){set('安定の丸型','stable','回転が長持ちする。地味に強い。');stab+=22;spin+=8}
  else if(sym<.55){set('左右非対称型','chaos','自分でも予測できない動きをする。')}
  else if(tall){set('高重心型','tip','不安定だが一撃が重い。');atk+=14}
  else if(wide){set('低重心型','heavy','吹き飛ばされにくい。');wt+=18;stab+=10}
  else set('なぞの生物型','random','分類できなかった。そのぶん何かが起きる。');
  const leg=['poop','eye','rainbow','dot'].includes(abil);
  const KAN={eye:['まばたきを忘れた月','こっちを見ている皿'],rainbow:['絵の具の事故','欲張りな虹'],dot:['描き忘れかけた点','宇宙の中心'],poop:['自信に満ちた何か','食後の茶色いソフトクリーム'],speed:['のびきった麺','怒った物干し竿','やる気のない矢印'],ghost:['穴のあいた靴下','働きすぎのチーズ'],pull:['帰ってこない浮き輪','空腹のドーナツ'],burst:['残業中の星','ヒトデの親戚'],bounce:['寝起きのウニ','反抗期の太陽'],random:['説明を拒む生き物','夢に出てくるやつ'],tip:['怒ったおにぎり','機嫌の悪い山'],heavy:['動く気のない冷蔵庫','座り込んだ家'],stable:['考えるのをやめた月','自信のあるまんじゅう'],chaos:['片方だけ伸びた靴下','酔った雲']};
  const kantei=pick(KAN[abil]);
  const boost=weird*.15*(poop?1:1), m=leg?1.3:1, f=v=>Math.round(clamp((v+boost)*m,5,100));
  return{name,cv,kantei,leg,aura:leg&&abil!='dot',ink,col,fill:Array.from({length:N},(_,i)=>fill(i)?1:0),cx,cy,prof,mean,maxR,type,abil,desc,weird:Math.round(weird),
    st:{atk:f(atk),wt:f(wt),spin:f(spin),stab:f(stab),spd:f(spd)}};
}

let me=null,meCode='',rival=null;
function enc(ss){const b=[];ss.slice(0,60).forEach(s=>{const pts=[];let l=null;s.p.forEach(q=>{if(!l||Math.hypot(q[0]-l[0],q[1]-l[1])>=6){pts.push(q);l=q}});const p=pts.slice(0,250);
  b.push(Math.max(0,COLORS.indexOf(s.c)),s.w,p.length);p.forEach(q=>b.push(clamp(Math.round(q[0]/2),0,255),clamp(Math.round(q[1]/2),0,255)))});
  let t='';b.forEach(v=>t+=String.fromCharCode(v));return'OB1-'+btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(str){str=str.trim();if(!str.startsWith('OB1-'))return null;try{const t=atob(str.slice(4).replace(/-/g,'+').replace(/_/g,'/')),ss=[];let i=0;
  while(i+3<=t.length){const c=COLORS[t.charCodeAt(i)]||COLORS[0],w=clamp(t.charCodeAt(i+1),4,40),n=t.charCodeAt(i+2);i+=3;const p=[];for(let k=0;k<n&&i+1<t.length;k++,i+=2)p.push([t.charCodeAt(i)*2,t.charCodeAt(i+1)*2]);if(p.length)ss.push({c,w,p})}
  return ss.length?ss:null}catch(e){return null}}
$('useCode').onclick=()=>{const ss=dec($('code').value),m=$('codeMsg');m.hidden=false;
  if(!ss){rival=null;m.textContent='コードを読めませんでした。OB1- から始まる文字列を丸ごと貼ってください。';return}
  const c=document.createElement('canvas');c.width=c.height=CS;const x=c.getContext('2d');ss.forEach(s=>drawStroke(x,s));const a=analyze(c,'挑戦者の絵');
  if(!a){rival=null;m.textContent='このコードの絵は小さすぎて戦えません。';return}rival=c;m.textContent='挑戦者の絵（'+a.type+'）を土俵に呼びました。あなたの絵を描いてください。'};
$('copy').onclick=()=>{const t=$('rCode');const done=()=>{$('copy').textContent='コピーしました'};const sel=()=>{t.focus();t.select();$('copy').textContent='選択しました。コピーしてください'};

let ac=null,sound=true;
function hitSound(p){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=pick(['square','sawtooth','triangle']);o.frequency.setValueAtTime(rnd(90,160)+p*220,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);
  g.gain.setValueAtTime(.12+p*.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.22)}catch(e){}}
function tone(f,dur){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}}

function collide(A,B){

function step(dt){

    if(tg&&!(t.isMe&&dashCd>.6)){ax+=(tg.x-t.x)/bd*acc;az+=(tg.z-t.z)/bd*acc}
    ax+=-t.z*.5*t.dir;az+=t.x*.5*t.dir;
    const wob=(1-t.a.st.stab/100)*2.2+(1-t.sp/t.sMax)*2;ax+=rnd(-1,1)*wob*3;az+=rnd(-1,1)*wob*3;

    if((t.abil=='burst'||t.abil=='rainbow')&&t.abT<=0){t.abT=t.abil=='burst'?4.5:2.6;popText(t.abil=='burst'?'謎の波動':'ぜんぶのせ',new THREE.Vector3(t.x,1.8,t.z),30);tone(660,.3);
      const m=new THREE.Mesh(new THREE.TorusGeometry(1,.12,6,28),new THREE.MeshBasicMaterial({color:'#f6c21a',transparent:true}));m.rotation.x=Math.PI/2;m.position.set(t.x,.3,t.z);scene.add(m);rings.push({m,t:0});
      for(const o of alive)if(o!=t){const dx=o.x-t.x,dz=o.z-t.z,d=Math.hypot(dx,dz)||1;if(d<5.5){o.vx+=dx/d*10;o.vz+=dz/d*10;o.sp-=5}}}

    if(t.abil=='poop'&&Math.random()<.15)burst(t.x,.5,t.z,1,['#7a4a1e','#5c3613'],.3);

    t.th+=t.dir*(5+17*clamp(t.sp/t.sMax,0,1)+(t.abil=='speed'?6:0))*dt;
  }

function loop(now){

  slow-=rdt;const dt=rdt*(slow>0?.18:1);phaseT+=rdt;const T=now/1000;
  if(phase=='count'){const n=3-Math.floor(phaseT/.8);$('count').textContent=n>0?n:'GO!';if(Math.floor(phaseT/.8)!=Math.floor((phaseT-rdt)/.8))tone(n>0?440:880,.15);
